<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameDev Duo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de móvil, como Duolingo. Ruta de unidades -> lección a pantalla completa con
   barra de progreso arriba y hoja de respuesta abajo. Verde "correcto", rojo "error", ámbar "XP". */
:root {
  --bg: #ffffff;
  --bg-2: #f4f6f2;
  --card: #ffffff;
  --ink: #2b2f36;
  --ink-2: #5b6270;
  --ink-3: #9aa1ad;
  --line: #e3e6ea;
  --green: #58a700;
  --green-bright: #6bc400;
  --green-soft: #e8f6d6;
  --green-shadow: #4a8f00;
  --red: #e03b3b;
  --red-soft: #fde7e7;
  --amber: #e89a00;
  --blue: #1a8fd6;
  --blue-soft: #e1f2fc;
  --code-bg: #1f2430;
  --code-ink: #e6e8ef;
  --code-com: #7f88a6;
  --code-kw: #8fb3ff;
  --code-ty: #7fd6c2;
  --code-str: #f2c27b;
  --code-num: #f59e8b;
  --code-fn: #d5b8ff;
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141820; --bg-2: #1b212b; --card: #1d232e; --ink: #eceff4; --ink-2: #b7bdc8; --ink-3: #7c8492; --line: #2e3644;
    --green: #7ad11a; --green-bright: #8fe02a; --green-soft: #1f3312; --green-shadow: #5a9c12;
    --red: #ff6b6b; --red-soft: #3a1c1f; --amber: #ffb627; --blue: #4fb6f5; --blue-soft: #16303f; --code-bg: #0e1118;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141820; --bg-2: #1b212b; --card: #1d232e; --ink: #eceff4; --ink-2: #b7bdc8; --ink-3: #7c8492; --line: #2e3644;
  --green: #7ad11a; --green-bright: #8fe02a; --green-soft: #1f3312; --green-shadow: #5a9c12;
  --red: #ff6b6b; --red-soft: #3a1c1f; --amber: #ffb627; --blue: #4fb6f5; --blue-soft: #16303f; --code-bg: #0e1118;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* ---------- Cabecera ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-weight: 900; font-size: 1.15rem; letter-spacing: -.01em; }
.brand b { color: var(--green); }
.stats { display: flex; gap: 14px; font-weight: 800; font-size: .95rem; font-variant-numeric: tabular-nums; }
.stat { display: inline-flex; align-items: center; gap: 5px; }
.stat i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: .72rem; color: #fff; }
.stat.racha i { background: var(--amber); }
.stat.xp i { background: var(--blue); }
.icon-btn { background: none; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font-weight: 800; cursor: pointer; }

/* ---------- Ruta ---------- */
.intro { padding-block: 16px 4px; }
.cursos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.curso-btn { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 8px; font-weight: 900; font-size: .9rem; cursor: pointer; box-shadow: 0 3px 0 var(--line); line-height: 1.2; }
.curso-btn small { display: block; font-weight: 700; font-size: .72rem; color: var(--ink-3); margin-top: 2px; }
.curso-btn.on { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 3px 0 var(--blue); color: var(--ink); }
.intro h1 { font-size: 1.6rem; line-height: 1.15; margin: 0 0 6px; font-weight: 900; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); }
.repaso { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.unit { margin: 22px 0; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); background: var(--card); }
.unit-head { display: flex; gap: 12px; align-items: center; padding: 14px 16px; color: #fff; }
.unit-badge { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: .9rem; background: rgba(255,255,255,.22); }
.unit-head > div { min-width: 0; }
.unit-head h2, .unit-head p { overflow-wrap: anywhere; }
.unit-head h2 { margin: 0; font-size: 1.08rem; line-height: 1.2; font-weight: 900; }
.unit-head p { margin: 2px 0 0; font-size: .85rem; opacity: .92; line-height: 1.3; }
.unit-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.unit-prog { display: flex; align-items: center; gap: 10px; font-size: .82rem; color: var(--ink-2); font-weight: 700; }
.bar { flex: 1; height: 12px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--green-bright); border-radius: 99px; transition: width .3s; }
.nodes { display: flex; flex-wrap: wrap; gap: 10px; }
.node { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; font-weight: 900; font-size: 1.05rem; color: #fff; background: var(--ink-3); box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.node.done { background: var(--amber); }
.node.next { background: var(--green-bright); box-shadow: 0 5px 0 var(--green-shadow); }
.node:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.unit-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Botones ---------- */
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 11px 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--line); text-transform: uppercase; letter-spacing: .03em; font-size: .9rem; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.btn.go { background: var(--green-bright); border-color: var(--green-bright); color: #fff; box-shadow: 0 4px 0 var(--green-shadow); }
.btn.go:disabled { background: var(--line); border-color: var(--line); color: var(--ink-3); box-shadow: 0 4px 0 var(--line); cursor: default; }
.btn.bad { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 0 #a52626; }
.btn.small { padding: 7px 12px; font-size: .78rem; }
.btn.wide { width: 100%; }

/* ---------- Lección ---------- */
.lesson { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lesson-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.close { background: none; border: none; font-size: 1.6rem; color: var(--ink-3); cursor: pointer; line-height: 1; padding: 4px; }
.hearts { font-weight: 900; color: var(--red); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lesson-scroll { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.qtype { font-size: .78rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin: 6px 0 4px; }
.qtype.nuevo { color: var(--amber); }
.qtext { font-size: 1.15rem; font-weight: 800; margin: 0 0 14px; line-height: 1.35; overflow-wrap: anywhere; }
.qtext code, .exp code, .chuleta code { font-family: var(--mono); font-size: .86em; background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; overflow-wrap: anywhere; font-weight: 600; }
.qtext pre code, .exp pre code, .chuleta pre code, .opt pre code { background: none; border: 0; padding: 0; font-size: inherit; font-weight: 400; overflow-wrap: normal; border-radius: 0; }
.lesson-top .bar { background: var(--line); }
pre.code { margin: 0 0 14px; background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: .8rem; line-height: 1.55; font-variant-ligatures: none; }
.t-com { color: var(--code-com); font-style: italic; } .t-kw { color: var(--code-kw); } .t-ty { color: var(--code-ty); }
.t-str { color: var(--code-str); } .t-num { color: var(--code-num); } .t-fn { color: var(--code-fn); } .t-pp { color: #f08bb4; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--code-com); padding: 0 4px; margin: 0 1px; color: var(--code-str); cursor: pointer; text-align: center; border-radius: 3px; }
.blank.empty { color: transparent; }
.blank.current { border-bottom-color: var(--green-bright); background: rgba(107,196,0,.12); }
.blank.ok { border-bottom-color: var(--green-bright); color: #b6f07a; }
.blank.ko { border-bottom-color: var(--red); color: #ffb3b3; }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--line); font-weight: 700; font-size: .98rem; overflow-wrap: anywhere; }
.opt code { font-family: var(--mono); font-size: .85em; }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 3px 0 var(--blue); }
.opt.right { border-color: var(--green); background: var(--green-soft); box-shadow: 0 3px 0 var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 var(--red); }
.opt.mono { font-family: var(--mono); font-size: .84rem; font-weight: 600; white-space: pre-wrap; }

.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 11px; font-family: var(--mono); font-size: .82rem; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.chip.used { visibility: hidden; }

.build { min-height: 60px; border: 2px dashed var(--line); border-radius: 14px; padding: 8px; display: grid; gap: 6px; margin-bottom: 12px; }
.build:empty::before { content: "Toca las líneas en orden para construir el código"; color: var(--ink-3); font-size: .9rem; padding: 8px; }
.line { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 10px; font-family: var(--mono); font-size: .78rem; font-weight: 600; cursor: pointer; white-space: pre; overflow-x: auto; box-shadow: 0 3px 0 var(--line); }
.build .line { background: var(--code-bg); color: var(--code-ink); border-color: var(--code-bg); box-shadow: none; }
.build .line.ok { border-color: var(--green); }
.build .line.ko { border-color: var(--red); }
.pool { display: grid; gap: 6px; }

.bugcode { display: grid; gap: 4px; margin-bottom: 14px; background: var(--code-bg); border-radius: 12px; padding: 8px; }
.bugline { text-align: left; border: 2px solid transparent; background: none; color: var(--code-ink); border-radius: 8px; padding: 4px 8px; font-family: var(--mono); font-size: .78rem; white-space: pre; overflow-x: auto; cursor: pointer; }
.bugline:hover { background: rgba(255,255,255,.05); }
.bugline.sel { border-color: var(--blue); background: rgba(79,182,245,.12); }
.bugline.right { border-color: var(--green-bright); background: rgba(107,196,0,.15); }
.bugline.wrong { border-color: var(--red); background: rgba(255,107,107,.15); }

.write { width: 100%; font-family: var(--mono); font-size: .9rem; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg-2); color: var(--ink); resize: vertical; min-height: 70px; }
.write:focus { outline: none; border-color: var(--blue); }
.write.right { border-color: var(--green); } .write.wrong { border-color: var(--red); }
.hint { font-size: .85rem; color: var(--ink-3); margin-top: 6px; }

/* ---------- Hoja de respuesta ---------- */
.sheet { border-top: 2px solid var(--line); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.sheet.ok { background: var(--green-soft); border-top-color: transparent; }
.sheet.ko { background: var(--red-soft); border-top-color: transparent; }
.verdict { font-weight: 900; font-size: 1.2rem; margin: 0 0 4px; }
.sheet.ok .verdict { color: var(--green); } .sheet.ko .verdict { color: var(--red); }
.exp { font-size: .93rem; margin: 0 0 12px; max-height: 34vh; overflow-y: auto; overflow-wrap: anywhere; }
.exp pre.code { margin: 8px 0 0; }

/* ---------- Fin y chuleta ---------- */
.done { text-align: center; padding-top: 30px; }
.done h2 { font-size: 1.8rem; margin: 10px 0; font-weight: 900; }
.done .big { display: flex; justify-content: center; gap: 14px; margin: 20px 0; flex-wrap: wrap; }
.done .box { border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px; min-width: 110px; }
.done .box b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.done .box span { font-size: .75rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.chuleta { padding-block: 10px 30px; }
.chuleta h3 { margin: 18px 0 6px; font-size: 1.05rem; }
.chuleta p, .chuleta li { color: var(--ink-2); font-size: .95rem; }
footer { color: var(--ink-3); font-size: .8rem; padding-block: 10px 40px; text-align: center; }
.sync { font-size: .75rem; font-weight: 800; color: var(--ink-3); white-space: nowrap; }
.sync.ok { color: var(--green); } .sync.err { color: var(--red); }
.meta { margin-top: 14px; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; background: var(--card); }
.meta-row { display: flex; justify-content: space-between; font-weight: 800; font-size: .9rem; gap: 10px; }
.meta-row span { color: var(--ink-3); font-weight: 700; }
.meta .bar > span { background: var(--amber); }
.combo { display: inline-block; margin-left: 8px; font-size: .85rem; color: var(--amber); font-weight: 900; }
.panel h3 { margin: 22px 0 8px; font-size: 1.05rem; }
.panel table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.panel td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.panel td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.panel .mini { width: 70px; height: 8px; }
.panel textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: .75rem; border-radius: 12px; border: 2px solid var(--line); background: var(--bg-2); color: var(--ink); padding: 10px; overflow-wrap: anywhere; }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.panel p { color: var(--ink-2); font-size: .92rem; }
.kbd { font-size: .78rem; color: var(--ink-3); text-align: center; margin: 14px 0 0; }
@media (hover: none) { .kbd { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span><span class="brand">GameDev<b>Duo</b></span> <span class="sync" id="sync"></span></span>
    <div class="stats">
      <span class="stat racha" title="Racha de días"><i>🔥</i><span id="st-racha">0</span></span>
      <span class="stat xp" title="Experiencia"><i>XP</i><span id="st-xp">0</span></span>
      <button type="button" class="icon-btn" id="tema" aria-label="Cambiar tema">◐</button>
      <button type="button" class="icon-btn" id="ajustes" aria-label="Progreso y copia de seguridad">☰</button>
    </div>
  </div>
</header>

<main class="wrap" id="ruta"></main>

<section class="lesson" id="leccion" hidden></section>

<footer class="wrap">C++ · SDL3 · Tiled · Box2D. El progreso se guarda en tu cuenta (si abres la web en claude.ai) y en este navegador.</footer>

<script>
/* =====================================================================
   Motor de la app. Las unidades se registran con DUO.unidad({...}) desde unidades/*.js
   Tipos de pregunta:
     test   { p, code?, o:[...], c }                 elegir una
     huecos { p, code con ▢, bank:[...], a:[...] }    completar con fichas (en orden)
     orden  { p, lines:[en orden], extra?:[...] }     construir el código tocando líneas
     escribe{ p, code?, a:[str|RegExp], ph? }         escribir una línea corta
     bug    { p, lines:[...], c }                     tocar la línea con el error
   Todas llevan e (explicación). Opcional: nuevo (concepto nuevo, se marca en ámbar)
   ===================================================================== */
(function () {
  "use strict";
  const unidades = [];
  const CURSOS = [
    { id: "box2d", nombre: "Box2D · Carreras", h1: "Programa física de juegos, ejercicio a ejercicio", p: "ejercicios de C++, Raylib y Box2D 2.4 para acabar programando tú solo el juego de carreras." },
    { id: "sdl", nombre: "SDL3 · Tiled", h1: "Construye tu motor con SDL3, ejercicio a ejercicio", p: "ejercicios de SDL3, pugixml, mapas de Tiled, Box2D 3, animaciones y pathfinding para programar tu plataformas." }
  ];
  let cursoReg = "box2d";
  let cur = "box2d";
  try { const c = localStorage.getItem("box2dduo.v1.curso"); if (c === "sdl" || c === "box2d") cur = c; } catch (e) {}
  const delCurso = () => unidades.filter((u) => u.curso === cur);
  const DUO = window.DUO = {
    unidad(u) { if (!u.curso) u.curso = cursoReg; unidades.push(u); },
    seccion(c) { cursoReg = c; },
    test: (p, o, c, e, x = {}) => Object.assign({ t: "test", p, o, c, e }, x),
    huecos: (p, code, bank, a, e, x = {}) => Object.assign({ t: "huecos", p, code, bank, a, e }, x),
    orden: (p, lines, e, x = {}) => Object.assign({ t: "orden", p, lines, e }, x),
    escribe: (p, a, e, x = {}) => Object.assign({ t: "escribe", p, a, e }, x),
    bug: (p, lines, c, e, x = {}) => Object.assign({ t: "bug", p, lines, c, e }, x)
  };

  // ---------- almacenamiento ----------
  const KEY = "box2dduo.v1";
  let S = { xp: 0, racha: 0, ultimoDia: "", hechas: {}, falladas: {}, vistas: {}, aciertos: {}, diaXp: { d: "", xp: 0 }, ok: 0, total: 0, t: 0 };
  const META = 50; // XP diaria
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) S = Object.assign(S, v); } catch (e) {}
  const guardar = () => { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} nube.programar(); };

  // ---------- guardado en la nube (claude.ai, privado por usuario) ----------
  // Mezcla: nos quedamos con el máximo de cada progreso, así nunca se pierde nada al usar dos dispositivos.
  function mezclar(a, b) {
    const r = Object.assign({}, a);
    r.xp = Math.max(a.xp || 0, b.xp || 0);
    r.ok = Math.max(a.ok || 0, b.ok || 0); r.total = Math.max(a.total || 0, b.total || 0);
    const nueva = (b.t || 0) > (a.t || 0) ? b : a;
    r.racha = nueva.racha || 0; r.ultimoDia = nueva.ultimoDia || "";
    r.hechas = Object.assign({}, a.hechas); for (const k in b.hechas || {}) r.hechas[k] = Math.max(r.hechas[k] || 0, b.hechas[k]);
    r.vistas = Object.assign({}, a.vistas, b.vistas);
    r.aciertos = Object.assign({}, a.aciertos, b.aciertos);
    r.falladas = Object.assign({}, nueva.falladas || {});
    const da = a.diaXp || {}, dbb = b.diaXp || {};
    r.diaXp = da.d === dbb.d ? { d: da.d, xp: Math.max(da.xp || 0, dbb.xp || 0) } : (da.d > dbb.d ? da : dbb);
    r.t = Math.max(a.t || 0, b.t || 0);
    return r;
  }
  const nube = (() => {
    let ref = null, timer = null, escribiendo = false, pendiente = false;
    const pon = (txt, cls) => { const el = document.getElementById("sync"); if (el) { el.textContent = txt; el.className = "sync " + (cls || ""); } };
    async function escribe() {
      if (!ref) return;
      if (escribiendo) { pendiente = true; return; }
      escribiendo = true; pon("☁ guardando…");
      try { await ref.set({ estado: JSON.stringify(S), v: 1 }); pon("☁ guardado", "ok"); }
      catch (e) { pon("☁ sin guardar", "err"); }
      escribiendo = false;
      if (pendiente) { pendiente = false; escribe(); }
    }
    async function iniciar() {
      if (!window.claude || !window.claude.use) return;
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id(); if (!id) return;
        ref = db.doc("data/users/" + id + "/progreso");
        pon("☁ cargando…");
        const snap = await ref.get();
        let remoto = null;
        if (snap.exists) {

          if (b.parentNode === pool) { build.appendChild(b); elegidas.push(+b.dataset.k); }
          else { pool.appendChild(b); elegidas.splice(elegidas.indexOf(+b.dataset.k), 1); }
          upd();
        });
        return {
          check() {
            let ok = elegidas.length === q.lines.length;
            [...build.children].forEach((b, pos) => { const it = items[+b.dataset.k]; const bien = it.i === pos || (it.i >= 0 && q.lines[it.i] === q.lines[pos]); b.classList.add(bien ? "ok" : "ko"); if (!bien) ok = false; });
            return ok;
          },
          solucion: () => codeHTML(q.lines.join("\n"))
        };
      }

      if (q.t === "escribe") {
        h += (q.code ? codeHTML(q.code) : "") + `<textarea class="write" id="w" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="${esc(q.ph || "Escribe el código…")}"></textarea><p class="hint">Los espacios dan igual. El punto y coma final es opcional.</p>`;
        Q.innerHTML = h; const w = Q.querySelector("#w");
        w.oninput = () => listo(w.value.trim().length > 0);
        return {
          check() { const v = norm(w.value); const ok = q.a.some((a) => (a instanceof RegExp ? a.test(v) : v === norm(a))); w.classList.add(ok ? "right" : "wrong"); w.readOnly = true; return ok; },
          solucion: q.a.some((a) => typeof a === "string") ? () => `<code>${esc(q.a.find((a) => typeof a === "string"))}</code>` : null
        };
      }

      if (q.t === "bug") {
        h += `<div class="bugcode">${q.lines.map((l, i) => `<button type="button" class="bugline" data-i="${i}">${hl(l) || " "}</button>`).join("")}</div>`;
        Q.innerHTML = h; let sel = -1;
        Q.querySelectorAll(".bugline").forEach((b) => b.onclick = () => { if (btn.dataset.fase) return; sel = +b.dataset.i; Q.querySelectorAll(".bugline").forEach((x) => x.classList.toggle("sel", x === b)); listo(true); });
        return { check() { Q.querySelectorAll(".bugline").forEach((x) => { x.classList.remove("sel"); if (+x.dataset.i === q.c) x.classList.add("right"); else if (+x.dataset.i === sel) x.classList.add("wrong"); }); return sel === q.c; } };
      }
    }
    siguiente();
  }

  document.addEventListener("keydown", (e) => {
    const L = document.getElementById("leccion"); if (L.hidden) return;
    if (e.key === "Escape") { const c = L.querySelector("#cerrar"); if (c) c.click(); return; }
    const enTexto = e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT");
    if (e.key === "Enter" && (!enTexto || !e.shiftKey)) {
      const b = L.querySelector("#comprobar, #volver"); if (b && !b.disabled && L.querySelector("#q")) { e.preventDefault(); b.click(); } return;
    }
    if (enTexto) return;
    const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
    const opts = L.querySelectorAll("#q .opt, #q .bugline, #q .chip:not(.used), #q #pool .line");
    if (opts[n - 1]) opts[n - 1].click();
  });
  window.addEventListener("DOMContentLoaded", () => { ruta(); nube.iniciar(); });
})();

        "def.position.Set(PIXEL_TO_METERS(x), PIXEL_TO_METERS(y));",
